name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# nem-lens-aemo is a path dependency (../aemo), so the job checks out der/
# and aemo/ side by side, as in a local NEM Lens checkout.

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: der
    steps:
      - uses: actions/checkout@v4
        with:
          path: der
      - uses: actions/checkout@v4
        with:
          repository: nem-lens/aemo
          path: aemo
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: der
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
